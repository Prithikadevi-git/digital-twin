name: Deploy React Website

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: digital-twin/digital-twin/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: digital-twin/digital-twin/frontend

      - name: Build React
        run: npm run build
        working-directory: digital-twin/digital-twin/frontend

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: digital-twin/digital-twin/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4